<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>library</title>
</head>
<body>
    <div class="interactive">
        <button class="btn">New Book</button>
    </div>
    <form>
        <div>
        <label for="Title">Name of Book</label>
        <input type="text" id="Title" name="title">
        </div>


        <div>
        <label for="Author">Author</label>
        <input type="text" id="Author" name="author">
        </div>

        <div>
        <label for="chNum">Total Chapter Nu.</label>
        <input type="number" id="chNum" name="chapterNumber">
        </div>

        <fieldset>
            <legend>Read?</legend>

            <div>
                <label for="completed">
                    Completed
                </label>
                <input type="radio" name="read_status" id="completed">
            </div>
            <div>
                <label for="reading">Reading</label>
                <input type="radio" name="read_status" id="reading">
                
            </div>
            <div>
                <label for="dropped">Dropped</label>
                <input type="radio" name="read_status" id="dropped">
            </div>
            <div>
                <label for="plan-to-read">Plan to Read</label>
                <input type="radio" name="read_status" id="plan-to-read">
            </div>
        </fieldset>

        <button type="submit" class="submit-button">Add Book</button>


    </form>
    <div class="container" ></div>

    
    <script src="script.js"></script>
</body>
</html>
